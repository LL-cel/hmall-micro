      config:   #配置中心
        file-extension: yaml # 文件后缀名
        namespace: ${NACOS_NAMESPACE:7bccccdc-36d8-41b3-9e7c-13cc9a7c7185}  #命名空间
        group: ${GROUP_NAME:DEFAULT_GROUP}    # 配置分组